<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ÄndGgner">
  <!-- Farben wie in style.css: Vordruckgrau als Grund, ein weißes Feld, schwarze Haarlinie,
       schwarzes Zeichen. Ein Favicon erbt keine CSS-Variablen, deshalb stehen die Werte hier
       ausgeschrieben. -->
  <rect width="32" height="32" fill="#d5d5d5"/>
  <rect x="0.5" y="0.5" width="31" height="31" fill="none" stroke="#000"/>
  <rect x="4.5" y="8.5" width="23" height="19" fill="#fff" stroke="#000"/>
  <text x="16" y="19" fill="#000" font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="bold" text-anchor="middle"
        dominant-baseline="central">§</text>
</svg>
